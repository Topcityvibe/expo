<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Define patterns for light/dark mode -->
  <defs>
    <style>
      .logo-text { fill: #0051ba; }
      .logo-accent { fill: #d4a574; }
      .dark .logo-text { fill: #ffffff; }
      .dark .logo-accent { fill: #d4a574; }
    </style>
  </defs>
  
  <!-- V Letter -->
  <path class="logo-text" d="M 280 150 L 400 450 L 480 450 L 600 150 L 500 150 L 420 350 L 380 350 L 300 150 Z"/>
  
  <!-- Gold accent lines -->
  <line x1="520" y1="150" x2="580" y2="280" stroke="#d4a574" stroke-width="20" stroke-linecap="round"/>
  <line x1="580" y1="150" x2="640" y2="280" stroke="#d4a574" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Curve decoration -->
  <path d="M 350 400 Q 450 440 550 380" stroke="#0051ba" stroke-width="15" fill="none" stroke-linecap="round"/>
  
  <!-- Globe -->
  <circle cx="720" cy="280" r="80" fill="none" stroke="#d4a574" stroke-width="12"/>
  <path d="M 640 280 Q 720 250 800 280" fill="none" stroke="#d4a574" stroke-width="12"/>
  <path d="M 640 280 Q 720 310 800 280" fill="none" stroke="#d4a574" stroke-width="12"/>
  <ellipse cx="720" cy="280" rx="70" ry="15" fill="none" stroke="#d4a574" stroke-width="12"/>
  
  <!-- VERTEX Text -->
  <text x="200" y="550" font-family="Georgia, serif" font-size="140" font-weight="bold" class="logo-text">VERTEX</text>
  
  <!-- Subtitle -->
  <text x="200" y="600" font-family="Arial, sans-serif" font-size="48" letter-spacing="4" class="logo-text">ASSESSMENT CENTER LIMITED</text>
  
  <!-- Tagline -->
  <text x="200" y="630" font-family="Arial, sans-serif" font-size="36" letter-spacing="2" class="logo-text">PRECISION • INTEGRITY • EXCELLENCE</text>
</svg>
